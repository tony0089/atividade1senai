<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema da Equipe</title>
</head>
<body>
    <!-- Título e Instruções -->
    <h1>Formulário de Cadastro de Membro</h1>
    <p>Preencha os dados abaixo para cadastrar um novo membro no sistema da equipe. Campos com asterisco (*) são obrigatórios.</p>
    <form action="#" method="POST">
    <!-- Campo 1: Texto (Obrigatório, minlength) -->
        <div>
            <label for="nome">Nome Completo *:</label><br>
            <input type="text" id="nome" name="nome" required minlength="3" placeholder="Digite o nome completo">
        </div>
        <br>
        <!-- Campo 2: E-mail (Obrigatório) -->
        <div>
            <label for="email">E-mail *:</label><br>
            <input type="email" id="email" name="email" required placeholder="email@exemplo.com">
        </div>
        <br>
        <!-- Campo 3: Número (min e max) -->
        <div>
            <label for="idade">Idade:</label><br>
            <input type="number" id="idade" name="idade" min="17" max="100" placeholder="Ex: 25">
        </div>
        <br>
        <!-- Campo 4: Select -->
        <div>
            <label for="setor">Setor / Departamento:</label><br>
            <select id="setor" name="setor">
                <option value="">Selecione uma opção</option>
                <option value="ti">Técnico em desenvolvimento</option>
                <option value="rh">Recursos Humanos</option>
                <option value="fin">Financeiro</option>
            </select>
        </div>
        <br>
        <!-- Campo 5: Radio -->
        <div>
            <label>Turno de Trabalho:</label><br>
            <input type="radio" id="turno_manha" name="turno" value="manha">
            <label for="turno_manha">Manhã</label>
            <input type="radio" id="turno_noite" name="turno" value="noite">
            <label for="turno_Noite">Noite</label>
        </div>
        <br>
        <!-- Campo 6: Textarea (ou poderia ser um checkbox) -->
        <div>
            <label for="observacoes">Observações (opcional):</label><br>
            <textarea id="observacoes" name="observacoes" rows="4" cols="30" placeholder="Adicione alguma observação sobre o membro..."></textarea>
        </div>
        <br>
        <button type="submit">Cadastrar</button>
    </form>
    <br>
    <a href="index.html">Voltar para a Página Inicial</a>
</body>
</html>
